# gitleaks 설정 — Metadium Explorer
#
# 기본 룰셋을 확장한다. 2026-09-09 에 실제로 저장소에서 나온 평문 6종으로 시험했더니
# 기본 룰셋은 3종밖에 못 잡았고, ★못 잡은 둘이 하필 제일 위험한 것들이었다.
#   - 텔레그램 봇 토큰 : 기본 telegram-bot-api-token 룰은 `TELEGRAM_TOKEN=...` 만 잡는다.
#                        우리 설정은 전부 Spring YAML 의 `token: '...'` 이라 통과했다
#   - Gmail 앱비밀번호 : 16자 소문자뿐이라 엔트로피가 낮아 generic 룰에 안 걸린다
# 아래 [[rules]] 는 그 구멍을 메운다.
#
# ★이 파일은 아래 5곳에 **동일하게 유지한다**. 한쪽만 고치면 조용히 갈라진다.
#   (hooks/pre-commit · scripts/install-git-hooks.sh 도 같다)
#     bitbucket  metadium-explorer-backend · block_explorer_front ·
#                explorer-front-ws · metadium-explorer-stack
#     github     METADIUM/meta-did-resolver   ← 이 저장소만 CI(Actions)도 있다
#   갈라짐은 gram cron `gitleaks-repo-watch.sh`(매시 :50)가 신규 커밋을 사후 스캔해
#   보완한다 — 훅은 opt-in 이고 Bitbucket 은 러너가 없어 CI 차단이 불가능하다.
# ★탐지 범위는 gitleaks 버전에 따라 다르다 — 기본 룰셋이 판마다 바뀐다.
#   기준 버전은 scripts/install-git-hooks.sh 의 GITLEAKS_VERSION 이다.
#   (실측: 소스 상수 `private static final String X = "..."` 는 8.28.0 의
#    generic-api-key 가 잡지만 8.21.2 는 못 잡는다)

[extend]
useDefault = true

# ── 텔레그램 봇 토큰 (키워드 없이 값 모양만으로 잡는다) ────────────────────
[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token (키워드 접두사 없이 값 형태로 탐지 — YAML token: '...' 대응)"
regex = '''\b[0-9]{8,10}:AA[A-Za-z0-9_\-]{33}\b'''
keywords = ["AA"]

# ── Google 앱 비밀번호 (16자 소문자, 공백 4-4-4-4 형태 포함) ───────────────
[[rules]]
id = "google-app-password"
description = "Google 앱 비밀번호 (16자 소문자 — 엔트로피가 낮아 generic 룰이 못 잡는다)"
regex = '''(?i)(?:pass(?:word)?|pwd|app[-_]?password)\s*[:=]\s*["']([a-z]{16}|[a-z]{4}\s[a-z]{4}\s[a-z]{4}\s[a-z]{4})["']'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

# ── 소스 상수에 박힌 비밀값 (X = "..." 형태) ───────────────────────────────
# ★2026-09-09 리뷰에서 드러난 공백이다. 이 코드베이스의 주 언어가 Java 인데
#   소스 상수 형태의 룰이 없었다. 기본 룰셋의 generic-api-key 는 **엔트로피**로
#   잡으므로 낮은 엔트로피 상수(`API_KEY = "companyapikey"`)를 놓치고, 판이
#   낮으면(8.21.2) 높은 엔트로피 상수마저 놓쳤다.
#
# ★이름의 '모양'으로 세 갈래를 본다 — 서술용 낱말을 나열해 빼는 방식(blocklist)은
#   프론트에서 오탐 11건을 만들고 낱말을 영구히 관리해야 한다(2026-09-09 실측).
#   1) UPPER_SNAKE 상수에 SECRET·TOKEN·PASSWORD·PASSWD 가 들어간 것 (Java·JS 상수 관례)
#   2) `..._KEY` 로 끝나는 UPPER_SNAKE  ← KEY 를 아무 위치나 허용하면 KEY_A·KEY_B 가 걸린다
#   3) 이름이 secret·token·password·passwd 로 **끝나는** 것 + apiKey·privateKey 계열
#      ⇒ passwordError·tokenList·tokens·cacheKey·rowKey 는 구조적으로 안 걸린다
[[rules]]
id = "source-constant-secret"
description = "소스 상수에 박힌 비밀값 (private static final String X = \"...\" / const X = \"...\")"
regex = '''(?:\b(?:[A-Z][A-Z0-9_]*)?(?:SECRET|TOKEN|PASSWORD|PASSWD)[A-Z0-9_]*\s*=\s*"([^"\n]{8,})")|(?:\b[A-Z][A-Z0-9_]*_KEY\s*=\s*"([^"\n]{8,})")|(?:(?i)\b[a-z_]*(?:secret|token|password|passwd)\s*=\s*"([^"\n]{8,})")|(?:(?i)\b(?:api|secret|private|access|auth)[-_]?key\s*=\s*"([^"\n]{8,})")'''
secretGroup = 1
keywords = ["secret", "token", "password", "passwd", "key"]
# RE2 는 negative lookahead 를 못 쓴다 → 제외는 allowlist 로 한다
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  # 검증용 정규식 상수 (Regex.PASSWORD 처럼 값이 패턴이다)
  '''=\s*"\^''',
  '''\(\?=''',
  # web3j 컨트랙트 래퍼의 함수명 상수 (FUNC_TOKENURI = "tokenURI" …)
  '''\bFUNC_[A-Z0-9_]*\s*=\s*"''',
  # ★셸 스크립트 대응 — 값이 경로·변수 확장으로 시작하면 비밀값이 아니다
  #   (TOKEN_FILE="$HOME/secrets/…" · SSH_KEY="~/.ssh/x.pem" · SECRET_PATH="/etc/…")
  '''=\s*"[$~/]''',
]
# ★프론트(Vue) 대응 — 템플릿 속성 바인딩은 대입이 아니다 (`:showToken="…"` · `@on-x="…"`).
#   줄 전체를 봐야 앞의 `:`·`@` 가 보이므로 regexTarget = "line" 이다.
[[rules.allowlists]]
regexTarget = "line"
regexes = [
  '''^\s*[:@][A-Za-z][A-Za-z0-9-]*\s*=\s*"''',
]

# ── Google reCAPTCHA 키 (값 모양만으로 잡는다) ─────────────────────────────
# ★2026-09-09 CVE 스캔 부산물로 드러난 **구조적 맹점**이다.
#   `nuxt.config.js` 에 reCAPTCHA 비밀키가 2023-09-22 부터 평문으로 있었는데
#   **어떤 룰도 못 잡았다** — 기본 룰셋 · generic-api-key · 위 source-constant-secret
#   전부 `no leaks found` 였다. 이유는 코드 모양이다:
#
#       recapcha_secret:                        ← 키워드는 여기
#         process.env.NODE_ENV === "development"
#           ? "6L…40자"                          ← 값은 다른 줄
#           : "6L…40자",
#
#   ★**키워드와 값이 다른 줄에 있으면 못 잡는다.** 우리 룰이 전부 단일 라인 정규식이고,
#   엔트로피 기반 generic-api-key 도 키워드 근접을 요구하기 때문이다. 삼항 연산자·
#   여러 줄 문자열 결합·YAML 다음 줄 값은 같은 이유로 전부 사각이다.
#   ⇒ 그래서 이 룰은 **키워드를 보지 않고 값의 형태만** 본다(텔레그램 토큰 룰과 같은 방식).
[[rules]]
id = "recaptcha-key-anywhere"
description = "Google reCAPTCHA 사이트키·비밀키 (6L + 38자. 키워드 근접을 요구하지 않는다)"
regex = '''\b6L[A-Za-z0-9_\-]{38}\b'''
keywords = ["6l"]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  # Google 이 문서로 공개한 테스트 키 쌍(항상 통과) — 비밀값이 아니다
  '''6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI''',
  '''6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe''',
]

# ── Spring YAML 평문 비밀번호 (플레이스홀더가 아닌 값) ─────────────────────
# ${ENV} · 빈 문자열 · 자명한 로컬 기본값은 통과시킨다. 그 외 password 값은 막는다.
[[rules]]
id = "spring-yaml-plaintext-password"
description = "Spring YAML 의 평문 password (환경변수 플레이스홀더로 바꿀 것)"
regex = '''(?im)^\s*password\s*:\s*["']?([^\s"'#]{8,})["']?\s*$'''
secretGroup = 1
keywords = ["password"]
# RE2 는 negative lookahead 를 지원하지 않는다 → 제외는 allowlist 로 한다
[rules.allowlist]
regexTarget = "match"
regexes = [
  # 환경변수 플레이스홀더 (이게 우리가 원하는 올바른 형태다)
  '''password\s*:\s*["']?\$\{''',
  # 자명한 로컬 기본값 — 접근권이 없어 비밀값이 아니다
  '''(?i)password\s*:\s*["']?(postgres|changeme|1234\d*|test|admin|root|example|dummy|sample|xxx+|\*+|secret|guest)["']?\s*$''',
  # 값 자체에 'password' 라는 낱말이 들어가면 플레이스홀더다 (mq_password, dbpassword, your-password …)
  '''(?i)password\s*:\s*["']?[a-z_-]*pass(word)?[a-z_-]*["']?\s*$''',
  # JS/TS 객체 리터럴의 **변수 참조**는 값이 아니다 (password: this.password, / payload.newPassword,)
  # ★끝의 쉼표를 요구한다 — YAML 에는 쉼표로 끝나는 값이 없으므로 YAML 탐지는 그대로다.
  #   따옴표가 붙은 실제 값(password: 'secret',)은 이 패턴에 안 맞아 계속 잡힌다.
  '''password\s*:\s*[A-Za-z_$][A-Za-z0-9_$.]*\s*,\s*$''',
]

# ── Spring YAML 평문 비밀번호 · 따옴표로 감싼 값 ───────────────────────────
# ★위 룰은 값에서 `#` 을 제외한다(YAML 인라인 주석 대응). 그 탓에 `#` 이 든 비밀번호가
#   통째로 통과했다(2026-09-09 리뷰 지적). `#` 은 비밀번호에 흔한 문자다.
#   따옴표 안쪽은 주석이 아니므로, 감싼 경우는 `#` 을 포함해 값 전체를 본다.
#   끝의 쉼표를 허용해 JS 객체 리터럴의 따옴표 값도 잡는다
#   (따옴표 없는 값은 문법상 변수 참조라 전역 allowlist 가 계속 통과시킨다).
[[rules]]
id = "spring-yaml-quoted-password"
description = "따옴표로 감싼 평문 password (# 등 특수문자 포함)"
regex = '''(?im)^\s*password\s*:\s*["\']([^"\'\n]{8,})["\']\s*,?\s*$'''
secretGroup = 1
keywords = ["password"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  # 환경변수 플레이스홀더 (이게 우리가 원하는 올바른 형태다)
  '''password\s*:\s*["\']?\$\{''',
  # 자명한 로컬 기본값 — 접근권이 없어 비밀값이 아니다
  '''(?i)password\s*:\s*["\']?(postgres|changeme|1234\d*|test|admin|root|example|dummy|sample|xxx+|\*+|secret|guest)["\']?\s*,?\s*$''',
  # 값 자체에 'password' 라는 낱말이 들어가면 플레이스홀더다
  '''(?i)password\s*:\s*["\']?[a-z_-]*pass(word)?[a-z_-]*["\']?\s*,?\s*$''',
]

[allowlist]
description = "오탐 억제"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''\.(lock|sum)$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)gradle/wrapper/''',
  '''\.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot|pdf)$''',
]
regexes = [
  # 환경변수 플레이스홀더는 비밀값이 아니다
  '''\$\{[A-Z_][A-Z0-9_]*(:[^}]*)?\}''',
  # 이더리움 주소는 비밀값이 아니다 (공개 원장에 있다)
  '''0x[a-fA-F0-9]{40}\b''',
  # ★0x+64hex(tx 해시 길이)는 일부러 넣지 않는다 — 그것을 허용하면 같은 길이인
  #   **개인키**(`private-key: '0x...'`)까지 함께 가려져 기본 룰셋보다 후퇴한다.
  #   tx 해시는 generic-api-key 의 키워드 근접 요건에 애초에 걸리지 않으므로
  #   빼도 노이즈가 늘지 않는다 (실측: 저장소 전체 findings 6건 → 6건).
  # 줄 끝에 gitleaks:allow 를 붙이면 의도적 예외로 인정한다
  '''gitleaks:allow''',
]
